<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeGrow Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F2F1F7; --line:#E6E4EE; --line-2:#D8D5E4;
  --ink:#1F1D2B; --ink-2:#4B4860; --ink-3:#7D7A92;
  --brand:#3A1F73; --brand-2:#5B3AA6; --brand-soft:#EFEAFB; --brand-ink:#FFFFFF;
  --teal:#0E8C8A; --teal-soft:#E3F4F3;
  --ok:#1F8A4C; --ok-soft:#E4F4EA; --warn:#B7791F; --warn-soft:#FBF1DE; --bad:#C0392B; --bad-soft:#FBE7E4; --info:#2F6FD1; --info-soft:#E6EFFC;
  --client:#C2410C; --client-soft:#FDEDE3;
  --shadow:0 1px 2px rgba(31,29,43,.05),0 6px 20px -8px rgba(58,31,115,.14);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12111A; --surface:#1B1A26; --surface-2:#232132; --line:#2E2C40; --line-2:#3A3850;
  --ink:#EDEBF5; --ink-2:#BDB9D0; --ink-3:#8E8AA6;
  --brand:#9C85E8; --brand-2:#B7A5F0; --brand-soft:#2A2345; --brand-ink:#15121F;
  --teal:#3CC3BF; --teal-soft:#16302F; --ok:#4CC37F; --ok-soft:#173022; --warn:#E3AE4F; --warn-soft:#352A15; --bad:#EE7B6E; --bad-soft:#3A1D1B; --info:#6FA3F0; --info-soft:#18263D;
  --client-soft:#3A2418; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#12111A; --surface:#1B1A26; --surface-2:#232132; --line:#2E2C40; --line-2:#3A3850;
  --ink:#EDEBF5; --ink-2:#BDB9D0; --ink-3:#8E8AA6;
  --brand:#9C85E8; --brand-2:#B7A5F0; --brand-soft:#2A2345; --brand-ink:#15121F;
  --teal:#3CC3BF; --teal-soft:#16302F; --ok:#4CC37F; --ok-soft:#173022; --warn:#E3AE4F; --warn-soft:#352A15; --bad:#EE7B6E; --bad-soft:#3A1D1B; --info:#6FA3F0; --info-soft:#18263D;
  --client-soft:#3A2418; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.serif{font-family:var(--serif)}
.muted{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}
svg.ico{flex:none;vertical-align:-3px}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{position:relative;overflow:hidden;background:#241448;color:#F3EEFF;padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between}
.login-art svg.bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.login-art .brandrow{position:relative;display:flex;align-items:center;gap:12px}
.login-art h1{position:relative;font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.2vw,56px);line-height:1.05;margin:0 0 20px;max-width:13ch;letter-spacing:-.01em}
.login-art p{position:relative;max-width:42ch;color:#CFC4EE;margin:0}
.login-art .stats{position:relative;display:flex;gap:36px;margin-top:36px;flex-wrap:wrap}
.login-art .stats b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;color:#fff}
.login-art .stats span{font-size:13px;color:#B9ACE0}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface)}
.login-form .box{width:100%;max-width:400px}
.login-form h2{font-family:var(--serif);font-weight:500;font-size:34px;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:84px;resize:vertical}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--brand)}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px}
.demo-accts{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.demo-accts .chipbtn{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);margin-top:8px;cursor:pointer}
.demo-accts .chipbtn:hover{border-color:var(--brand-2)}

/* ---------- BUTTONS / CHIPS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:13px}
.btn svg{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--info-soft);color:var(--info)} .b-brand{background:var(--brand-soft);color:var(--brand)} .b-teal{background:var(--teal-soft);color:var(--teal)} .b-mute{background:var(--surface-2);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.app.collapsed{grid-template-columns:76px 1fr}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;z-index:30}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.sb-brand .wordmark{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.sb-brand .wordmark small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:14px;position:relative}
.nav a svg{width:19px;height:19px;flex:none;stroke-width:1.7}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav .count{margin-left:auto;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.nav-group{font-size:11.5px;color:var(--ink-3);font-weight:600;padding:16px 12px 6px}
.app.collapsed .nav a span,.app.collapsed .nav .count,.app.collapsed .nav-group,.app.collapsed .sb-brand .wordmark,.app.collapsed .sb-foot{display:none}
.app.collapsed .nav a{justify-content:center}
.sb-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.main{min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px clamp(16px,3vw,32px);padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));display:flex;align-items:center;gap:16px}
.cobrand{display:flex;align-items:center;gap:12px;min-width:0}
.cobrand .x{color:var(--ink-3);font-size:14px}
.cobrand .cname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period{margin:0 auto;font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:center;white-space:nowrap}
.period b{color:var(--ink-2);font-weight:600}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .pip{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--client-soft);color:var(--client);flex:none}
.userbtn{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;border-radius:12px;border:0;background:transparent;cursor:pointer}
.userbtn:hover{background:var(--surface-2)}
.userbtn .who{text-align:left;line-height:1.2}
.userbtn .who b{display:block;font-size:13.5px} .userbtn .who span{font-size:12px;color:var(--ink-3)}
.dropdown{position:absolute;right:clamp(16px,3vw,32px);top:calc(64px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;min-width:200px;z-index:50}
.dropdown button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border:0;background:transparent;border-radius:8px;font-size:14px;cursor:pointer;text-align:left}
.dropdown button:hover{background:var(--surface-2)}
.dropdown svg{width:17px;height:17px}
.content{padding:clamp(16px,3vw,32px);max-width:1360px;width:100%;margin:0 auto;flex:1}
.footer{padding:24px clamp(16px,3vw,32px) 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.footer b{color:var(--ink-2)}
.mobile-only{display:none}
.bottomnav{display:none}

/* ---------- LAYOUT PRIMITIVES ---------- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.pagehead h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,34px);margin:0;letter-spacing:-.01em;line-height:1.15}
.pagehead p{margin:4px 0 0;color:var(--ink-3);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.005em}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:20px}
.mt{margin-top:20px} .mt-s{margin-top:10px}
.divider{height:1px;background:var(--line);margin:16px 0}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .6s ease}
.progress.teal i{background:var(--teal)}
.progress.lg{height:12px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.t th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- DASHBOARD ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.welcome{background:var(--brand);color:#F4F0FF;border-radius:var(--r-lg);padding:28px;position:relative;overflow:hidden;border:0}
:root[data-theme="dark"] .welcome{background:#2A1C55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .welcome{background:#2A1C55}}
.welcome svg.deco{position:absolute;right:-40px;bottom:-60px;width:320px;opacity:.9;pointer-events:none}
.welcome h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,40px);margin:0 0 6px;line-height:1.1;position:relative}
.welcome p{margin:0;color:#D6CCF5;position:relative;max-width:48ch}
.welcome .meta{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap;position:relative;font-size:13px;color:#C7BAEE}
.welcome .meta b{display:block;color:#fff;font-size:14.5px;font-weight:600}
.welcome .bigprog{position:relative;margin-top:22px}
.welcome .bigprog .progress{background:rgba(255,255,255,.16)} .welcome .bigprog .progress i{background:#fff}
.welcome .bigprog .row-between{font-size:13px;margin-bottom:8px;color:#D6CCF5}
.welcome .bigprog .row-between b{font-family:var(--serif);font-size:26px;color:#fff;font-weight:500}
.nowcard{display:flex;flex-direction:column;gap:14px}
.nowrow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.nowrow:last-child{border-bottom:0;padding-bottom:0}
.nowrow .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.nowrow .ic svg{width:18px;height:18px}
.nowrow .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.nowrow .val{font-weight:600;font-size:14.5px;line-height:1.35}
.kpi{position:relative}
.kpi .k-lbl{font-size:13px;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi .k-lbl svg{width:18px;height:18px;color:var(--ink-3)}
.kpi .k-val{font-family:var(--serif);font-size:40px;font-weight:500;line-height:1.1;margin:8px 0 4px;letter-spacing:-.01em}
.kpi .k-val small{font-size:18px;color:var(--ink-3)}
.kpi .k-sub{font-size:13px;color:var(--ink-3)}
.up{color:var(--ok);font-weight:700}

/* Journey rail */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative;margin-top:8px}
.rail::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:23px;height:2px;background:var(--line-2)}
.rail .fill{position:absolute;left:calc(100%/12);top:23px;height:2px;background:var(--brand);transition:width .8s ease}
.stop{position:relative;text-align:center;padding:0 4px;cursor:pointer;border:0;background:none}
.stop .node{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);position:relative;z-index:1;font-weight:700;font-size:12.5px;color:var(--ink-3)}
.stop.done .node{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stop.now .node{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 6px var(--brand-soft)}
.stop .mn{font-weight:700;font-size:14px}
.stop .th{font-size:12.5px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.stop:hover .mn{color:var(--brand)}

/* list items */
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;margin-top:1px}
.li .tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.li .tick svg{width:13px;height:13px}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;font-size:14.5px}
.li .sub{font-size:13px;color:var(--ink-3)}
.clickable{cursor:pointer}
.clickable:hover .ttl{color:var(--brand)}

/* Session card */
.sess{border:1px solid var(--line);border-radius:var(--r-md);padding:18px;background:var(--surface)}
.sess .date{display:flex;gap:14px;align-items:center}
.datebox{width:54px;flex:none;text-align:center;border-radius:10px;background:var(--brand-soft);color:var(--brand);padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--serif);font-size:22px;font-weight:500}
.datebox span{font-size:11px;font-weight:700}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500}

/* Month cards / timeline */
.monthgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--brand-2)}
.mcard .mnum{font-size:12px;font-weight:700;color:var(--brand)}
.mcard h4{font-family:var(--serif);font-weight:500;font-size:22px;margin:4px 0 2px}
.mcard.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.vtl{position:relative;padding-left:34px}
.vtl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.vtl .ev{position:relative;padding-bottom:22px}
.vtl .ev::before{content:"";position:absolute;left:-29px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line-2)}
.vtl .ev.done::before{background:var(--brand);border-color:var(--brand)}
.vtl .ev.now::before{border-color:var(--brand)}

.item{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h5{margin:0;font-size:15px;font-weight:700}
.item .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.item .meta b{color:var(--ink-2);font-weight:600}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);padding:8px;font-size:12px;font-weight:700;color:var(--ink-3);text-align:center}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--bg)} .cal .day.out .dn{color:var(--ink-3);opacity:.5}
.cal .dn{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:2px 4px}
.cal .day.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:6px;display:inline-block;align-self:flex-start}
.chip{font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.c-session{background:var(--brand-soft);color:var(--brand)} .c-deadline{background:var(--warn-soft);color:var(--warn)} .c-event{background:var(--teal-soft);color:var(--teal)} .c-milestone{background:var(--ok-soft);color:var(--ok)} .c-review{background:var(--info-soft);color:var(--info)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;min-width:840px}
.week .wd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;min-height:220px;display:flex;flex-direction:column;gap:6px}
.week .wd.today{border-color:var(--brand)}

/* Gallery */
.gal-feature{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.photo{position:relative;border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--surface-2);aspect-ratio:4/3}
.photo svg{width:100%;height:100%;display:block}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(15,10,30,.78));color:#fff;font-size:13px}
.photo .cap b{display:block;font-size:14px}
.photo.big{aspect-ratio:16/10}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

/* doc & report */
.fileic{background:#6B7280;width:42px;height:48px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;position:relative}
.ft-pdf{background:#C0392B} .ft-docx{background:#2F6FD1} .ft-xlsx{background:#1F8A4C} .ft-pptx{background:#C2410C} .ft-zip{background:#6B7280}

/* Score */
.score-wrap{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-label b{font-family:var(--serif);font-size:48px;font-weight:500;line-height:1;display:block}
.ring-label span{font-size:13px;color:var(--ink-3)}
.bars .b{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center;font-size:14px;margin-bottom:12px}
.bars .b:last-child{margin-bottom:0}
.bars .b span:last-child{text-align:right;font-weight:700}

/* Updates / notif */
.upd{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.upd:last-child{border-bottom:0}
.upd .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.upd .ic svg{width:19px;height:19px}
.upd.unread .ttl::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-left:8px;vertical-align:middle}

/* Events */
.evbanner{border-radius:var(--r-md);overflow:hidden;aspect-ratio:16/7;margin-bottom:14px}
.evbanner svg{width:100%;height:100%;display:block}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(18,12,36,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:720px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);animation:rise .2s ease}
.modal.wide{max-width:920px}
.modal .mh{padding:22px 24px 0;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.modal .mh h2{margin:0;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.2}
.modal .mb{padding:18px 24px 24px}
.modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.modal h4{font-size:13px;color:var(--ink-3);font-weight:700;margin:20px 0 8px}
.modal ul,.modal ol{margin:0;padding-left:20px} .modal li{margin:4px 0}
@keyframes fade{from{opacity:0}} @keyframes rise{from{opacity:0;transform:translateY(12px)}}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;color:var(--line-2)}

.radio-list{display:flex;flex-direction:column;gap:8px}

.radio-list input{accent-color:var(--brand)}

.fb-banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--teal-soft);border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:20px}
.fb-banner b{color:var(--teal)}
.toggle{position:relative;width:42px;height:24px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line-2);border-radius:999px;cursor:pointer;transition:.2s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span::after{transform:translateX(18px)}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.admin-strip{background:var(--ink);color:var(--bg);padding:8px clamp(16px,3vw,32px);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.admin-strip button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:1024px){
  .hero,.g-dash{grid-template-columns:1fr}
  .monthgrid,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .period{display:none}
}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-art{min-height:auto;padding:32px 24px}
  .login-art .stats{display:none}
  .app,.app.collapsed{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:auto;width:280px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 60px rgba(0,0,0,.25);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none}
  .app.collapsed .nav a span,.app.collapsed .nav .count,.app.collapsed .nav-group,.app.collapsed .sb-brand .wordmark,.app.collapsed .sb-foot{display:revert}
  .app.collapsed .nav a{justify-content:flex-start}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .mobile-only{display:grid}
  .desk-only{display:none!important}
  .g2,.gal-feature{grid-template-columns:1fr}
  .userbtn .who{display:none}
  .cobrand .cname{display:none}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:40}

  .modal .mh,.modal .mb,.modal .mf{padding-left:18px;padding-right:18px}
  .bars .b{grid-template-columns:90px 1fr 40px}

.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}

const fmtS=(s)=>{const d=D(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const fmtL=(s)=>{const d=D(s);return `${DOW[d.getDay()]}, ${d.getDate()} ${MONF[d.getMonth()]} ${d.getFullYear()}`};

/* =========================================================
   DATA LAYER
   Live mode: the artifact's shared database.
     clients/{cid}            → company profile
     data/{cid}__{section}    → one document per portal section
   Local mode (opened outside claude.ai): browser storage only.
   ========================================================= */
const SECTIONS={months:[],actions:[],sessions:[],reports:[],updates:[],events:[],photos:[],documents:[],notifications:[],feedback:[],scores:{history:[],dept:[]},meta:{readUpdates:[],registrations:[],settings:{}}};
const DB={clients:{}};

const Data={
  mode:'loading', canAdmin:true, db:null, assets:null, profiles:{}, sections:{}, got:{c:false,d:false}, q:{}, error:null,
  async init(){
    const cl=window.claude;
    if(!cl||typeof cl.use!=='function'){ this.goLocal(); return }
    let db=null; try{ db=await cl.use('db') }catch(e){ db=null }
    if(!db){ this.goLocal(); return }
    this.db=db; this.mode='live';
    try{ const u=await cl.use('user'); this.canAdmin=u?!!(await u.canEdit()):false }catch(e){ this.canAdmin=false }
    cl.use('assets').then(a=>{this.assets=a}).catch(()=>{});
    const fail=(e)=>{ this.error=(e&&e.message)||'The portal database could not be reached.'; this.got={c:true,d:true}; this.rebuild() };
    db.collection('clients').onSnapshot(s=>{ const p={}; s.docs.forEach(d=>{p[d.id]=d.data()}); this.profiles=p; this.got.c=true; this.rebuild() }, fail);
    db.collection('data').onSnapshot(s=>{ const p={}; s.docs.forEach(d=>{p[d.id]=d.data()}); this.sections=p; this.got.d=true; this.rebuild() }, fail);
  },
  goLocal(){ this.mode='local'; const s=store.get('localdb',null); if(s){this.profiles=s.profiles||{};this.sections=s.sections||{}} this.got={c:true,d:true}; this.rebuild() },
  saveLocal(){ try{ localStorage.setItem('wg:localdb',JSON.stringify({profiles:this.profiles,sections:this.sections})) }catch(e){ toast('Browser storage is full — this change is kept only until you reload') } },
  get ready(){ return this.got.c && this.got.d },
  rebuild(){
    const out={};
    Object.entries(this.profiles).forEach(([cid,p])=>{
      const c={...clone(p),id:cid};
      Object.entries(SECTIONS).forEach(([sec,def])=>{ const d=this.sections[cid+'__'+sec]; c[sec]=d&&d.v!==undefined?clone(d.v):clone(def) });
      out[cid]=normalize(c);
    });
    DB.clients=out;
    if(this.ready) requestRender();
  },
  write(path,body){
    const prev=this.q[path]||Promise.resolve();
    const p=prev.then(()=>this.db.doc(path).set(body)).catch(e=>{
      const m=e&&e.code==='quota_exceeded'?'Storage is full for this portal. Delete old photos or files, then try again.':
              e&&e.code==='not_granted'?'You do not have permission to change this portal.':'A change could not be saved. Check your connection and try again.';
      toast(m); throw e;
    });
    this.q[path]=p.catch(()=>{}); return p;
  },
  remove(path){ if(this.mode==='live') return this.db.doc(path).delete().catch(()=>toast('Could not delete — try again')); return Promise.resolve() },
  patch(cid,sec,v){
    const body={cid,section:sec,v:clone(v),updatedAt:new Date().toISOString()};
    this.sections[cid+'__'+sec]=body; this.rebuild();
    if(this.mode==='live') return this.write('data/'+cid+'__'+sec,body);
    this.saveLocal(); return Promise.resolve();
  },
  saveProfile(cid,prof){
    const body=clone(prof); delete body.id; SECTION_KEYS.forEach(k=>delete body[k]);
    this.profiles[cid]=body; this.rebuild();
    if(this.mode==='live') return this.write('clients/'+cid,body);
    this.saveLocal(); return Promise.resolve();
  },
  async deleteClient(cid){
    delete this.profiles[cid]; Object.keys(SECTIONS).forEach(s=>delete this.sections[cid+'__'+s]); this.rebuild();
    if(this.mode==='live'){ await this.remove('clients/'+cid); for(const s of Object.keys(SECTIONS)) await this.remove('data/'+cid+'__'+s) }
    else this.saveLocal();
  },
  async upload(file){
    const ext=extOf(file.name);
    if(!OK_EXT[ext]) throw new Error(`${file.name}: Word, Excel, PowerPoint and ZIP files can't be stored in the portal yet. Save it as a PDF, or paste a share link instead.`);
    const meta={name:file.name,type:ext,size:fmtSize(file.size)};
    if(this.assets){
      try{ const r=await this.assets.upload(file,{type:OK_EXT[ext]}); return {...meta,assetId:r.id} }
      catch(e){ const code=e&&e.code;
        throw new Error(code==='too_large'?`${file.name} is larger than 20 MB. Compress it and try again.`:
          code==='not_granted'||code==='capability_disabled'?'File uploads are turned off for this portal. Allow uploads in the artifact permissions, or paste a link instead.':
          code==='quota_or_state'?'File storage for this portal is full. Delete old files first.':`${file.name} could not be uploaded. Try again.`) }
    }
    if(this.mode==='live') throw new Error('File uploads are not available in this view. Paste a share link instead.');
    if(file.size<700*1024){ const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)}); return {...meta,url} }
    return meta;
  }
};
const SECTION_KEYS=Object.keys(SECTIONS);

function syncMonths(c){
  const s=D(c.start||TODAY);
  const ms=(c.months&&c.months.length?c.months:MONTH_TEMPLATE.map((t,i)=>({n:i+1,theme:t[0],objective:t[1],focus:[],outcome:'',notes:''})));
  c.months=ms.slice(0,6).map((m,i)=>{const d=new Date(s.getFullYear(),s.getMonth()+i,1);return {...m,n:i+1,focus:m.focus||[],key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,name:MONF[d.getMonth()],year:d.getFullYear()}});
}
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}` }
function normalize(c){
  c.company=c.company||'Untitled client'; c.short=c.short||c.company.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  c.color=c.color||'#C2410C'; c.areas=c.areas||[]; c.start=c.start||TODAY; c.end=c.end||addDays(c.start,181);
  c.contact=c.contact||''; c.consultant=c.consultant||ADMIN_USER.name;
  syncMonths(c);
  c.actions=(c.actions||[]).map(a=>({comments:[],attachments:[],progress:0,status:'Not Started',priority:'Medium',month:1,desc:'',owner:'',...a,attachments:(a.attachments||[]).map(asFile)}))
    .sort((a,b)=>a.month-b.month||String(a.due).localeCompare(String(b.due)));
  c.sessions=(c.sessions||[]).map(s=>{const x={agenda:[],objectives:[],attachments:[],mode:'Online',status:'Upcoming',duration:90,location:'',link:'',notes:'',consultant:c.consultant,...s};
    if(x.start&&x.end){x.time=`${fmtTime(x.start)} – ${fmtTime(x.end)}`;const [h1,m1]=x.start.split(':').map(Number),[h2,m2]=x.end.split(':').map(Number);const dur=(h2*60+m2)-(h1*60+m1);if(dur>0)x.duration=dur}
    x.time=x.time||''; x.attachments=(x.attachments||[]).map(asFile); return x}).sort((a,b)=>a.date.localeCompare(b.date));
  ['reports','updates','events','photos','documents','notifications','feedback'].forEach(k=>c[k]=c[k]||[]);
  c.events=c.events.map(e=>({agenda:[],speakers:[],participants:'',seats:'',desc:'',time:'',loc:'',hue:hueOf(e.id),...e}));
  c.photos=c.photos.map(p=>({hue:hueOf(p.id),seed:(hueOf(p.id)%13)+1,...p}));
  c.scoreHistory=(c.scores&&c.scores.history)||[]; c.dept=(c.scores&&c.scores.dept&&c.scores.dept.length?c.scores.dept:DEFAULT_AREAS.map(k=>({k,prev:0,v:0})));
  c.meta={readUpdates:[],registrations:[],settings:{},...(c.meta||{})};
  c.readUpdates=c.meta.readUpdates;
  return c;
}
function hueOf(s){let h=0;String(s||'x').split('').forEach(ch=>h=(h*31+ch.charCodeAt(0))%360);return h}
function getUsers(){ return [ADMIN_USER, ...Object.values(DB.clients).filter(c=>c.email&&c.status!=='Archived').map(c=>({email:c.email,clientId:c.id,pass:c.password||'',role:'client',name:c.contact||c.company,title:c.contactTitle||''}))] }
function notify(cid,cat,text,link){ const c=DB.clients[cid]; if(!c) return; return Data.patch(cid,'notifications',[{id:uid('N'),cat,text,date:TODAY,read:false,link},...c.notifications]) }
function saveMeta(c){ return Data.patch(c.id,'meta',c.meta) }

function login(email,pass,remember){
  const u=getUsers().find(x=>x.email.toLowerCase()===email.trim().toLowerCase() || (x.clientId && x.clientId.toLowerCase()===email.trim().toLowerCase()));
  if(!u||!u.pass||u.pass!==pass) return false;
  if(u.role==='admin'&&!Data.canAdmin) return 'noadmin';
  state.user=u; state.clientId=u.clientId; state.previewAs=null;
  try{ (remember?localStorage:sessionStorage).setItem('wg:session',u.email) }catch(e){}
  return true;
}

function restore(){ let e=null; try{ e=localStorage.getItem('wg:session')||sessionStorage.getItem('wg:session') }catch(x){}
  const u=e&&getUsers().find(x=>x.email===e); if(u&&u.role==='admin'&&!Data.canAdmin) return; if(u){state.user=u;state.clientId=u.clientId} }

/* scope(): the ONLY way views read client data.
   A client user is pinned to their own clientId; an admin can
   only read a client when explicitly previewing it. */
function scope(){
  if(!state.user) throw new Error('Not authenticated');
  const cid = state.user.role==='client' ? state.user.clientId : state.previewAs;
  if(!cid || !DB.clients[cid]) return null;
  return DB.clients[cid];
}

function monthProgress(c,n){const a=c.actions.filter(x=>x.month===n);return a.length?Math.round(a.reduce((s,x)=>s+x.progress,0)/a.length):0}
function overall(c){return c.actions.length?Math.round(c.actions.reduce((s,x)=>s+(+x.progress||0),0)/c.actions.length):0}
function elapsedPct(c){return Math.min(100,Math.max(0,Math.round(daysBetween(c.start,TODAY)/daysBetween(c.start,c.end)*100)))}
function currentMonth(c){const k=TODAY.slice(0,7);return c.months.find(m=>m.key===k)||(k<c.months[0].key?c.months[0]:c.months[c.months.length-1])}
function actionCounts(c){const r={total:c.actions.length,Completed:0,'In Progress':0,'Under Review':0,'Not Started':0,Delayed:0};c.actions.forEach(a=>r[a.status]++);return r}
function sessionCounts(c){return {total:c.sessions.length,done:c.sessions.filter(s=>s.status==='Completed').length}}
function nextSession(c){return c.sessions.find(s=>s.date>=TODAY&&s.status==='Upcoming')}
function lastSession(c){return [...c.sessions].reverse().find(s=>s.date<=TODAY&&s.status==='Completed')}
function score(c){return c.scoreHistory.length?c.scoreHistory[c.scoreHistory.length-1].v:0}
function prevScore(c){return c.scoreHistory.length?c.scoreHistory[0].v:0}
function openActions(c){return c.actions.filter(a=>a.status!=='Completed').sort((a,b)=>a.due.localeCompare(b.due))}
function pendingFeedback(c){return c.sessions.filter(s=>s.status==='Completed'&&!c.feedback.some(f=>f.session===s.id))}
function unreadCount(c){return c.notifications.filter(n=>!n.read).length}

function calendarItems(c){
  const out=[];
  c.sessions.filter(s=>s.status!=='Cancelled').forEach(s=>out.push({date:s.date,type:'session',title:s.title,ref:s.id,time:s.time}));
  c.actions.forEach(a=>out.push({date:a.due,type:'deadline',title:a.title,ref:a.id}));
  c.events.forEach(e=>out.push({date:e.date,type:'event',title:e.title,ref:e.id,time:e.time}));
  c.months.forEach(m=>{const [y,mm]=m.key.split('-').map(Number);const last=new Date(y,mm,0);out.push({date:iso(last),type:'milestone',title:`Month ${m.n} close: ${m.theme}`,ref:'M'+m.n});
    out.push({date:`${m.key}-26`,type:'review',title:`Monthly review — ${m.name}`,ref:'M'+m.n})});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function ring(pct,size=180,stroke=14,color='var(--brand)'){
  const r=(size-stroke)/2, C=2*Math.PI*r, off=C*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 1s ease"/></svg>`;
}
function donut(parts,size=170,stroke=26){
  const r=(size-stroke)/2, C=2*Math.PI*r, total=parts.reduce((s,p)=>s+p.v,0)||1; let acc=0;
  const segs=parts.map(p=>{const len=C*p.v/total;const s=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${stroke}" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size/2} ${size/2})"><title>${p.k}: ${Math.round(p.v/total*100)}%</title></circle>`;acc+=len;return s}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>${segs}</svg>`;
}
function legendList(parts){const t=parts.reduce((s,p)=>s+p.v,0)||1;return `<div style="display:flex;flex-direction:column;gap:10px;min-width:150px">${parts.map(p=>`<div class="row-between small"><span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${p.c};display:inline-block"></i>${p.k}</span><b>${Math.round(p.v/t*100)}%</b></div>`).join('')}</div>`}
function hbars(rows,{showPrev=false}={}){

function lineChart(pts,{w=560,h=220,min=40,max=100,color='var(--brand)'}={}){
  const pad={l:34,r:16,t:16,b:28}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const x=i=>pad.l+(pts.length===1?iw/2:i*iw/(pts.length-1)), y=v=>pad.t+ih-(v-min)/(max-min)*ih;
  const grid=[min,(min+max)/2,max].map(v=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}</text>`).join('');
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');
  const area=`${d} L${x(pts.length-1)},${pad.t+ih} L${x(0)},${pad.t+ih} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img">${grid}<path d="${area}" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"/><text x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${p.v}</text><text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="11.5" fill="var(--ink-3)">${p.m}</text>`).join('')}</svg>`;
}
function radar(rows,{size=300}={}){
  const cx=size/2, cy=size/2, R=size/2-44, n=rows.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100, cy+Math.sin(a)*R*v/100]};
  const rings=[25,50,75,100].map(v=>`<polygon points="${rows.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const axes=rows.map((r,i)=>{const [x,y]=pt(i,100);const [lx,ly]=pt(i,122);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink-2)">${r.k}</text>`}).join('');
  const poly=(key,col,op)=>`<polygon points="${rows.map((r,i)=>pt(i,r[key]).join(',')).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2"/>`;
  return `<svg viewBox="-50 0 ${size+100} ${size}" width="100%" style="max-width:${size+100}px;display:block;margin:0 auto" role="img">${rings}${axes}${poly('prev','var(--ink-3)',.06)}${poly('v','var(--brand)',.18)}</svg>`;
}
function colBars(rows,{h=200}={}){
  const w=Math.max(360,rows.length*70), pad={l:10,r:10,t:22,b:28}, ih=h-pad.t-pad.b, bw=(w-pad.l-pad.r)/rows.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block" role="img">${rows.map((r,i)=>{const bh=ih*r.v/100, x=pad.l+i*bw+bw*.22, y=pad.t+ih-bh;return `<rect x="${x}" y="${pad.t}" width="${bw*.56}" height="${ih}" rx="6" fill="var(--surface-2)"/><rect x="${x}" y="${y}" width="${bw*.56}" height="${bh}" rx="6" fill="${r.c||'var(--brand)'}"/><text x="${x+bw*.28}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${r.v}%</text><text x="${x+bw*.28}" y="${h-8}" text-anchor="middle" font-size="11.5" fill="var(--ink-3)">${r.k}</text>`}).join('')}</svg>`;
}

function photoSVG(hue,seed,w=400,h=300){
  let s=seed*9301+49297; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  const bg1=`hsl(${hue} 38% 30%)`, bg2=`hsl(${(hue+30)%360} 45% 52%)`;
  let people=''; const n=4+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){const x=40+i*(w-80)/(n-1)+(rnd()*20-10), sc=.8+rnd()*.4, y=h*.62;
    people+=`<g opacity=".92"><circle cx="${x}" cy="${y-38*sc}" r="${15*sc}" fill="hsl(${(hue+200)%360} 20% ${80-rnd()*20}%)"/><rect x="${x-22*sc}" y="${y-20*sc}" width="${44*sc}" height="${70*sc}" rx="${18*sc}" fill="hsl(${(hue+rnd()*120)%360} 30% ${35+rnd()*20}%)"/></g>`}
  const board=`<rect x="${w*.18}" y="${h*.1}" width="${w*.64}" height="${h*.32}" rx="6" fill="hsl(${hue} 30% 92%)" opacity=".9"/>${[0,1,2,3].map(i=>`<rect x="${w*.22+i*w*.15}" y="${h*.15+(i%2)*12}" width="${w*.1}" height="${h*.08}" rx="3" fill="hsl(${(hue+i*50)%360} 60% 70%)"/>`).join('')}<path d="M${w*.27} ${h*.3} C ${w*.4} ${h*.36}, ${w*.55} ${h*.22}, ${w*.72} ${h*.33}" stroke="hsl(${hue} 30% 40%)" stroke-width="2" fill="none"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${seed}${hue}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g${seed}${hue})"/>${board}<rect y="${h*.8}" width="${w}" height="${h*.2}" fill="hsl(${hue} 25% 22%)" opacity=".5"/>${people}<rect x="${w*.08}" y="${h*.78}" width="${w*.84}" height="10" rx="5" fill="hsl(${hue} 20% 18%)" opacity=".6"/></svg>`;
}

function actionCard(a){

    <div style="display:flex;gap:12px;align-items:center"><div class="progress" style="flex:1"><i style="width:${a.progress}%;${a.status==='Delayed'?'background:var(--bad)':a.status==='Completed'?'background:var(--ok)':''}"></i></div><b class="small">${a.progress}%</b></div>
    <div class="row-between small muted"><span>${a.comments.length} comment${a.comments.length===1?'':'s'} · ${a.attachments.length} attachment${a.attachments.length===1?'':'s'}</span><span style="color:var(--brand);font-weight:600">View details</span></div>

function monthDetail(c,n){
  const m=c.months.find(x=>x.n===n), items=c.actions.filter(a=>a.month===n), p=monthProgress(c,n);

  <button class="btn sm ghost" data-apmonth="" style="margin-bottom:14px">${ic('chevL')}Back to all months</button>
  <div class="card">
    <div class="row-between" style="flex-wrap:wrap;align-items:flex-start;gap:20px">

        <h2 class="serif" style="font-weight:500;font-size:32px;margin:4px 0 10px">${esc(m.theme)}</h2>
        <div class="kv"><dt>Objective</dt><dd>${esc(m.objective)}</dd><dt>Expected outcome</dt><dd>${esc(m.outcome)}</dd></div>

function actionPlanPage(c){

      return `<button class="mcard ${m.key===cm.key?'now':''}" data-month="${m.n}"><div class="row-between"><span class="mnum">Month ${String(m.n).padStart(2,'0')}</span><span class="badge ${st==='Completed'?'b-ok':st==='Current month'?'b-brand':'b-mute'}">${st}</span></div><h4>${m.name}</h4><div class="small" style="font-weight:600">${esc(m.theme)}</div><div class="small muted" style="margin:8px 0 14px;min-height:42px">${esc(m.objective)}</div><div style="display:flex;gap:10px;align-items:center"><div class="progress" style="flex:1"><i style="width:${p}%"></i></div><b class="small">${p}%</b></div><div class="tiny muted" style="margin-top:8px">${items.filter(a=>a.status==='Completed').length}/${items.length} action items complete</div></button>`}).join('')}</div>`;

      ${c.actions.map(a=>`<tr class="click" data-action="${a.id}"><td><b>${esc(a.title)}</b></td><td>${c.months[a.month-1].name.slice(0,3)}</td><td>${esc(a.owner)}</td><td>${fmtS(a.due)}</td><td>${prioBadge(a.priority)}</td><td>${statusBadge(a.status)}</td><td><div class="progress"><i style="width:${a.progress}%"></i></div></td></tr>`).join('')}
    </tbody></table></div></div>`;

    body=`<div class="vtl card">${c.months.map(m=>{const cls=m.key<cm.key?'done':m.key===cm.key?'now':'';return `<div class="ev ${cls}"><div class="row-between" style="flex-wrap:wrap"><div><span class="small" style="color:var(--brand);font-weight:700">${m.name} ${m.year}</span><div style="font-family:var(--serif);font-size:20px">${esc(m.theme)}</div></div><button class="btn sm" data-month="${m.n}">Open month</button></div>

  }
  const ac=actionCounts(c);
  return `
  <div class="pagehead"><div><h1>6-month business transformation plan</h1><p>${esc(c.company)} · ${MONF[D(c.start).getMonth()]} ${D(c.start).getFullYear()} → ${MONF[D(c.end).getMonth()]} ${D(c.end).getFullYear()}</p></div>

  <div class="card" style="margin-bottom:20px"><div class="grid" style="grid-template-columns:auto 1fr;gap:28px;align-items:center">
    <div style="position:relative">${ring(ov,120,11)}<div class="ring-label"><div><b style="font-size:30px">${ov}%</b><span>overall</span></div></div></div>
    <div><div class="legend" style="gap:22px">${Object.entries(STATUS).map(([k,cl])=>`<span><span class="badge ${cl}">${ac[k]}</span>${k}</span>`).join('')}</div>

  </div></div>

}

      <div style="display:flex;gap:8px;flex-wrap:wrap">${s.mode==='Online'?`<button class="btn sm primary" data-join="${s.id}">${ic('video')}Join session</button>`:''}<button class="btn sm" data-session="${s.id}">View details</button></div>
    </div>`).join('')}</div>`
  :`<div class="card" style="padding:8px 0"><div class="tablewrap"><table class="t"><thead><tr><th>Session</th><th>Date</th><th>Mode</th><th>Duration</th><th>Status</th><th>Your feedback</th></tr></thead><tbody>

function sessionModal(c,id){

      ${sm?`
        <h4>Participants</h4><div class="small">${(sm.participants||[]).map(esc).join(' · ')}</div>
        <h4>Key discussions</h4><ul class="small">${(sm.discussions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <h4>Key findings</h4><ol class="small">${(sm.findings||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
        <h4>Decisions made</h4><ul class="small">${(sm.decisions||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        <h4>Next steps</h4><ul class="small">${(sm.next||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`

        ${s.objectives.length?`<h4>Objectives</h4><ul class="small">${s.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}

      ${s.status==='Completed'?`<h4>Your feedback</h4>${f?`<div class="small"><span style="color:#E0A526">${'★'.repeat(f.rating)}</span> · ${esc(f.relevance)}${f.useful?` — “${esc(f.useful)}”`:''}</div>`:'<div class="small muted">Not submitted yet.</div>'}`:''}
    </div>
    <div class="mf">${s.status==='Completed'?`${!f?`<button class="btn teal" data-fb="${s.id}">Give feedback</button>`:''}<button class="btn primary" data-dl="${fileKey(sm&&sm.file||{name:'Session_Report_'+s.id+'.pdf',type:'pdf'})}">${ic('download')}Download session report</button>`:`${s.mode==='Online'?`<button class="btn primary" data-join="${s.id}">${ic('video')}Join session</button>`:''}<button class="btn" data-ics="${s.id}">${ic('calendar')}Add to calendar</button>`}</div>`, 'wide');
}

function feedbackModal(c,id){
  const s=c.sessions.find(x=>x.id===id); if(!s) return;
  openModal(`
    <div class="mh"><div><div class="small muted">${esc(s.title)} · ${fmt(s.date)}</div><h2>How was today's session?</h2></div><button class="iconbtn" data-close aria-label="Close">${ic('close')}</button></div>
    <form class="mb" id="fbForm">
      <div class="field"><label>Overall session rating</label><div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button type="button" data-star="${i}" aria-label="${i} star${i>1?'s':''}">${ic('star')}</button>`).join('')}</div></div>
      <div class="field"><label for="fu">What did you find useful?</label><textarea class="input" id="fu"></textarea></div>
      <div class="field"><label>Was the session relevant to your business?</label><div class="radio-list">${['Very Relevant','Relevant','Neutral','Not Relevant'].map((r,i)=>`<label><input type="radio" name="rel" value="${r}" ${i===0?'checked':''}>${r}</label>`).join('')}</div></div>
      <div class="field"><label for="fi">What should we improve?</label><textarea class="input" id="fi"></textarea></div>
      <div class="field"><label for="fc">Additional comments</label><textarea class="input" id="fc"></textarea></div>
      <div id="fbErr"></div>
      <button class="btn primary block" type="submit">Submit feedback</button>
      <div class="tiny muted" style="text-align:center;margin-top:10px">Shared only with your WeGrow consulting team.</div>
    </form>`);
  let rating=0;
  const paint=()=>document.querySelectorAll('#stars button').forEach(b=>b.classList.toggle('on',+b.dataset.star<=rating));
  document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{rating=+b.dataset.star;paint()});
  document.getElementById('fbForm').onsubmit=(e)=>{e.preventDefault();
    if(!rating){document.getElementById('fbErr').innerHTML='<div class="err">Select a rating from 1 to 5 stars to submit.</div>';return}
    const fb={session:s.id,rating,useful:fu.value.trim(),relevance:document.querySelector('input[name=rel]:checked').value,improve:fi.value.trim(),comments:fc.value.trim(),date:TODAY};
    if(isPreview()){ closeModal(); toast('Preview only — feedback is not saved when you view as the client'); return }
    c.feedback=[...c.feedback.filter(x=>x.session!==s.id),fb]; Data.patch(c.id,'feedback',c.feedback);
    closeModal(); toast('Feedback submitted — thank you'); render();
  };
}

// ---------- CALENDAR ----------
const CAL_LBL={session:'Session',deadline:'Deadline',event:'Event',milestone:'Milestone',review:'Review'};
function calLegend(){return `<div class="legend">${Object.entries(CAL_LBL).map(([k,v])=>`<span><i class="c-${k}" style="background:currentColor"></i>${v}</span>`).join('')}</div>`}
function calMonthGrid(c,firstIso,types){
  const items=calendarItems(c).filter(x=>!types||types.includes(x.type));
  const f=D(firstIso), start=new Date(f); start.setDate(1-f.getDay());
  let cells=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const out=d.getMonth()!==f.getMonth();
    const its=items.filter(x=>x.date===k);
    cells+=`<div class="day ${out?'out':''} ${k===TODAY?'today':''}"><span class="dn">${d.getDate()}</span>${its.slice(0,3).map(x=>`<div class="chip c-${x.type}" data-cal="${x.type}|${x.ref}" title="${esc(x.title)}">${esc(x.title)}</div>`).join('')}${its.length>3?`<div class="tiny muted" style="padding-left:4px">+${its.length-3} more</div>`:''}</div>`;
    if(i>=34 && d.getMonth()!==f.getMonth() && d.getDay()===6) break;
  }
  return `<div class="cal">${cells}</div>`;
}
function calendarPage(c){
  const v=state.calView, cur=D(state.calCursor);
  let body='', label='';
  if(v==='month'){label=`${MONF[cur.getMonth()]} ${cur.getFullYear()}`;body=calMonthGrid(c,state.calCursor)}
  else if(v==='week'){const s=D(state.weekCursor);const days=[...Array(7)].map((_,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);return iso(d)});
    label=`${fmtS(days[0])} – ${fmt(days[6])}`;const items=calendarItems(c);
    body=`<div class="tablewrap"><div class="week">${days.map(k=>`<div class="wd ${k===TODAY?'today':''}"><div class="small" style="font-weight:700">${DOW[D(k).getDay()]} <span class="muted">${D(k).getDate()}</span></div>${items.filter(x=>x.date===k).map(x=>`<div class="chip c-${x.type}" style="white-space:normal;padding:6px 8px" data-cal="${x.type}|${x.ref}">${x.time?`<div class="tiny" style="opacity:.8">${x.time.split(' –')[0]}</div>`:''}${esc(x.title)}</div>`).join('')||'<div class="tiny muted">Nothing scheduled</div>'}</div>`).join('')}</div></div>`}
  else {label='Next 60 days';const items=calendarItems(c).filter(x=>x.date>=TODAY&&x.date<=addDays(TODAY,60));const byDay={};items.forEach(x=>(byDay[x.date]=byDay[x.date]||[]).push(x));
    body=`<div class="card" style="padding:8px 22px">${Object.entries(byDay).map(([d,xs])=>`<div class="li" style="align-items:flex-start"><div class="datebox" style="${d===TODAY?'':'background:var(--surface-2);color:var(--ink-2)'}"><b>${D(d).getDate()}</b><span>${MON[D(d).getMonth()]}</span></div><div class="grow" style="display:flex;flex-direction:column;gap:6px"><div class="tiny muted" style="font-weight:700">${fmtL(d)}</div>${xs.map(x=>`<div class="chip c-${x.type}" style="white-space:normal;padding:7px 10px;font-size:13px" data-cal="${x.type}|${x.ref}"><b>${CAL_LBL[x.type]}</b> · ${esc(x.title)}${x.time?` · ${x.time}`:''}</div>`).join('')}</div></div>`).join('')}</div>`}
  return `<div class="pagehead"><div><h1>Calendar</h1><p>Sessions, deadlines, events, reviews and milestones in one view.</p></div>
    <div class="seg">${[['month','Month'],['week','Week'],['agenda','Agenda']].map(x=>`<button class="${v===x[0]?'on':''}" data-calview="${x[0]}">${x[1]}</button>`).join('')}</div></div>
  <div class="row-between" style="margin-bottom:14px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">${v!=='agenda'?`<button class="iconbtn" data-calnav="-1" aria-label="Previous">${ic('chevL')}</button><button class="iconbtn" data-calnav="1" aria-label="Next">${ic('chevR')}</button><button class="btn sm" data-calnav="0">Today</button>`:''}<b style="font-size:18px;margin-left:6px">${label}</b></div>${calLegend()}</div>
  ${body}`;
}

// ---------- generic form modal ----------
function fieldHTML(f){
  const id='f_'+f.k, v=f.value;
  const lab=`<label for="${id}">${esc(f.label)}${f.req?' <span style="color:var(--bad)">*</span>':''}</label>`;
  const help=f.help?`<span class="tiny muted">${f.help}</span>`:'';
  const wrap=(inner,extra='')=>`<div class="field ${f.full?'full':''} ${extra}">${inner}</div>`;
  switch(f.type){
    case 'heading': return `<div class="full fhead">${esc(f.label)}</div>`;
    case 'html': return `<div class="full">${f.html}</div>`;
    case 'textarea': return wrap(`${lab}<textarea class="input" id="${id}" name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>${help}`);
    case 'lines': return wrap(`${lab}<textarea class="input" id="${id}" name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'One item per line')}">${esc((v||[]).join('\n'))}</textarea>${help||'<span class="tiny muted">One item per line</span>'}`);
    case 'select': return wrap(`${lab}<select class="input" id="${id}" name="${f.k}">${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>${help}`);
    case 'range': return wrap(`<label for="${id}">${esc(f.label)} <b id="${id}_o">${v||0}%</b></label><input type="range" id="${id}" name="${f.k}" min="0" max="100" step="5" value="${v||0}" oninput="document.getElementById('${id}_o').textContent=this.value+'%'" style="accent-color:var(--brand)">${help}`);
    case 'check': return wrap(`<label class="check"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}> ${esc(f.label)}</label>${help}`);
    case 'clients': { const sel=new Set(v||[]); return wrap(`<label>${esc(f.label)}${f.req?' <span style="color:var(--bad)">*</span>':''}</label><div class="clientpick">${allClients().map(c=>`<label class="check"><input type="checkbox" name="${f.k}" value="${c.id}" ${sel.has(c.id)?'checked':''}>${clientLogo(c,22)} ${esc(c.company)}</label>`).join('')}</div><button type="button" class="btn sm ghost" style="align-self:flex-start" onclick="this.previousElementSibling.querySelectorAll('input').forEach(i=>i.checked=true)">Select all clients</button>`) }
    case 'file': { const cur=v?(Array.isArray(v)?v:[v]).map(asFile).filter(Boolean):[];
      return wrap(`${lab}<label class="filedrop" for="${id}">${ic('paperclip')}<span id="${id}_n">${f.multiple?'Choose files':'Choose a file'}</span><input type="file" id="${id}" name="${f.k}" ${f.multiple?'multiple':''} accept="${f.accept||''}" onchange="document.getElementById('${id}_n').textContent=this.files.length?[...this.files].map(x=>x.name).join(', '):'${f.multiple?'Choose files':'Choose a file'}'"></label>
        ${cur.length?`<div class="tiny muted">Current: ${cur.map(x=>esc(x.name)).join(', ')}${f.keepable!==false?` · <label class="check tiny" style="display:inline-flex"><input type="checkbox" name="${f.k}__clear"> Remove</label>`:''}</div>`:''}
        ${f.link?`<input class="input" name="${f.k}__link" placeholder="…or paste a share link (Google Drive, OneDrive, Dropbox)" value="${esc((cur[0]&&!cur[0].assetId&&cur[0].url&&!String(cur[0].url).startsWith('data:'))?cur[0].url:'')}">`:''}
        <span class="tiny muted">${f.help||'PDF, images, video, CSV or text · up to 20 MB'}</span>`) }
    default: return wrap(`${lab}<input class="input" type="${f.type||'text'}" id="${id}" name="${f.k}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'min="0"':''}>${help}`);
  }
}
function readFields(fields,form){
  const o={};
  fields.forEach(f=>{
    if(!f.k) return;
    const el=form.elements[f.k];
    switch(f.type){
      case 'lines': o[f.k]=el.value.split('\n').map(s=>s.trim()).filter(Boolean); break;
      case 'check': o[f.k]=el.checked; break;
      case 'range': case 'number': o[f.k]=el.value===''?'':Number(el.value); break;
      case 'clients': o[f.k]=[...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value); break;
      case 'file': { const inp=form.querySelector(`input[type=file][name="${f.k}"]`); const ln=form.elements[f.k+'__link']; const clr=form.elements[f.k+'__clear'];
        o[f.k]={files:inp?[...inp.files]:[],link:ln?ln.value.trim():'',clear:!!(clr&&clr.checked),current:f.value}; break }
      default: o[f.k]=el?el.value.trim():'';
    }
  });
  return o;
}
function fileGiven(x){ return x&&(x.files.length||x.link||(x.current&&!x.clear)) }
async function resolveFile(x,{many=false}={}){
  if(!x) return many?[]:null;
  if(x.files.length){ const out=[]; for(const f of x.files) out.push(await Data.upload(f)); return many?out:out[0] }
  if(x.link){ const nm=decodeURIComponent(x.link.split('?')[0].split('/').filter(Boolean).pop()||'Linked file'); const f={name:nm.length>60?'Linked file':nm,type:'link',url:/^https?:\/\//.test(x.link)?x.link:'https://'+x.link}; return many?[f]:f }
  if(x.clear) return many?[]:null;
  const cur=x.current; if(!cur) return many?[]:null;
  return many?(Array.isArray(cur)?cur:[cur]):(Array.isArray(cur)?cur[0]:cur);
}
function formModal({title,sub,fields,submit='Save',onSubmit,wide,done,onOpen}){
  openModal(`<div class="mh"><div>${sub?`<div class="small muted">${sub}</div>`:''}<h2>${esc(title)}</h2></div><button class="iconbtn" data-close aria-label="Close">${ic('close')}</button></div>
    <form class="mb" id="fm" novalidate><div class="fgrid">${fields.map(fieldHTML).join('')}</div><div id="fmErr"></div></form>
    <div class="mf"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" form="fm" id="fmGo">${esc(submit)}</button></div>`, wide?'wide':'');
  const form=document.getElementById('fm'), go=document.getElementById('fmGo'), err=document.getElementById('fmErr');
  if(onOpen) onOpen(form);
  form.onsubmit=async(e)=>{ e.preventDefault(); err.innerHTML='';
    const vals=readFields(fields,form);
    const miss=fields.find(f=>f.req&&(f.type==='file'?!fileGiven(vals[f.k]):f.type==='clients'?!vals[f.k].length:vals[f.k]===''||vals[f.k]==null));
    if(miss){ err.innerHTML=`<div class="err">${esc(miss.label)} is required.</div>`; const el=form.querySelector(`[name="${miss.k}"]`); el&&el.focus(); return }
    go.disabled=true; const lbl=go.textContent; go.textContent='Saving…';
    try{ const msg=await onSubmit(vals); closeModal(); toast(msg||done||'Saved'); }
    catch(ex){ err.innerHTML=`<div class="err">${esc(ex.message||String(ex))}</div>`; go.disabled=false; go.textContent=lbl }
  };
}
function confirmModal(text,label,fn){
  openModal(`<div class="mh"><h2>${esc(text)}</h2><button class="iconbtn" data-close aria-label="Close">${ic('close')}</button></div><div class="mb"><p class="small muted" style="margin:0">The client will no longer see this in their portal. This can't be undone.</p></div>
  <div class="mf"><button class="btn" data-close>Keep it</button><button class="btn danger" id="cfGo">${esc(label)}</button></div>`);

}

function scoresForm(cid){
  const c=DB.clients[cid]; const rows=c.dept.map(d=>({...d}));
  const row=(d,i)=>`<tr><td><input class="input" name="k${i}" value="${esc(d.k)}"></td><td><input class="input" type="number" min="0" max="100" name="p${i}" value="${d.prev}"></td><td><input class="input" type="number" min="0" max="100" name="v${i}" value="${d.v}"></td></tr>`;
  openModal(`<div class="mh"><div><div class="small muted">${esc(c.company)}</div><h2>Update transformation scores</h2></div><button class="iconbtn" data-close aria-label="Close">${ic('close')}</button></div>
  <form class="mb" id="scF"><table class="t" style="min-width:0"><thead><tr><th>Area</th><th>Baseline %</th><th>Current %</th></tr></thead><tbody id="scRows">${rows.map(row).join('')}</tbody></table>
  <button type="button" class="btn sm ghost" id="scAdd" style="margin-top:8px">${ic('plus')}Add area</button>
  <div class="divider"></div>
  <div class="fgrid"><div class="field"><label for="scL">Log this month's overall score as</label><input class="input" id="scL" value="${MON[D(TODAY).getMonth()]}"></div>
  <div class="field"><label for="scV">Overall score (0–100)</label><input class="input" id="scV" type="number" min="0" max="100" placeholder="Leave blank to use the average of the areas"></div></div>
  <div class="tiny muted">Score history: ${c.scoreHistory.map(h=>`${esc(h.m)} ${h.v}`).join(' → ')||'none yet'}</div><div id="scErr"></div></form>
  <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" type="submit" form="scF">Publish scores</button></div>`,'wide');
  let n=rows.length;
  document.getElementById('scAdd').onclick=()=>{document.getElementById('scRows').insertAdjacentHTML('beforeend',row({k:'',prev:0,v:0},n++))};
  document.getElementById('scF').onsubmit=async(e)=>{e.preventDefault(); const f=e.target; const dept=[];
    for(let i=0;i<n;i++){ const k=f.elements['k'+i]; if(!k||!k.value.trim()) continue; const cl=x=>Math.max(0,Math.min(100,Number(x)||0)); dept.push({k:k.value.trim(),prev:cl(f.elements['p'+i].value),v:cl(f.elements['v'+i].value)}) }
    if(!dept.length){document.getElementById('scErr').innerHTML='<div class="err">Add at least one area.</div>';return}
    const overallV=f.elements.scV.value!==''?Math.max(0,Math.min(100,+f.elements.scV.value)):Math.round(dept.reduce((s,d)=>s+d.v,0)/dept.length);
    const lbl=f.elements.scL.value.trim()||MON[D(TODAY).getMonth()];
    const hist=[...c.scoreHistory.filter(h=>h.m!==lbl),{m:lbl,v:overallV}];
    await Data.patch(cid,'scores',{history:hist,dept}); closeModal(); toast(`Scores published — overall ${overallV}/100`)};
}

        ${fb.slice(0,4).map(x=>`<div class="li"><div class="grow"><div class="row-between"><b class="small">${esc(x.s?x.s.title:'Session')}</b>${stars(x.f.rating)}</div><div class="tiny muted">${esc(x.c.company)} · ${fmtS(x.f.date)}</div>${x.f.useful?`<div class="small" style="margin-top:4px">“${esc(x.f.useful)}”</div>`:''}</div></div>`).join('')||'<div class="small muted">Feedback appears here after clients rate a session.</div>'}

// ---------- CLIENT WORKSPACE ----------
function contentCounts(c){ return [['plan','Action items',c.actions.length,'task'],['sessions','Sessions',c.sessions.length,'session'],['reports','Reports',c.reports.length,'report'],['documents','Documents',c.documents.length,'document'],['photos','Photos',c.photos.length,'photo'],['updates','Updates',c.updates.length,'update'],['events','Events',c.events.length,'event'],['notifications','Notifications',c.notifications.length,'notif']] }
function wsTab(c,tab){
  const cid=c.id; const add=(kind,label)=>`<button class="btn primary" data-adm="${kind}" data-cid="${cid}">${ic('plus')}${label}</button>`;
  const rowBtns=(kind,sec,id,label)=>`<button class="btn sm ghost" data-adm="${kind}" data-cid="${cid}" data-id="${id}">Edit</button><button class="btn sm ghost danger-t" data-del="${sec}" data-cid="${cid}" data-id="${id}" data-label="${esc(label)}">Delete</button>`;
  const fileCell=f=>{f=asFile(f);return f&&fileHref(f)?`<button class="btn sm ghost" data-dl="${fileKey(f)}">${ic('paperclip')}${esc(f.name.length>28?f.name.slice(0,26)+'…':f.name)}</button>`:f?`<span class="tiny muted">${esc(f.name)} (sample)</span>`:'<span class="tiny muted">No file</span>'};
  switch(tab){
    case 'overview': { const ac=actionCounts(c), ns=nextSession(c), att=attentionItems([c]);
      return `<section class="grid g4">
        <div class="card kpi"><div class="k-lbl">Overall progress</div><div class="k-val">${overall(c)}<small>%</small></div><div class="k-sub">Month ${currentMonth(c).n} of 6 · ${esc(currentMonth(c).theme)}</div></div>
        <div class="card kpi"><div class="k-lbl">Action items</div><div class="k-val">${ac.total}</div><div class="k-sub">${ac.Completed} done · ${c.actions.filter(isOverdue).length} overdue</div></div>
        <div class="card kpi"><div class="k-lbl">Next session</div><div class="k-val" style="font-size:28px">${ns?fmtS(ns.date):'—'}</div><div class="k-sub">${ns?esc(ns.title):'Schedule one'}</div></div>
        <div class="card kpi"><div class="k-lbl">Transformation score</div><div class="k-val">${score(c)||'—'}<small>/100</small></div><div class="k-sub">${c.feedback.length} session ratings</div></div></section>
      <div class="grid g-dash mt"><div class="card"><div class="card-head"><h3>What's in this client's portal</h3><span class="small muted">Everything here is visible to ${esc(c.contact||'the client')}</span></div>
        <div class="contentgrid">${contentCounts(c).map(x=>`<div class="cc"><a href="#/admin-client/${cid}/${x[0]}"><b class="serif">${x[2]}</b><span>${x[1]}</span></a><button class="btn sm ghost" data-adm="${x[3]}" data-cid="${cid}" aria-label="Add ${x[1]}">${ic('plus')}Add</button></div>`).join('')}</div></div>
        <div class="card"><div class="card-head"><h3>Needs attention</h3></div>${att.map(x=>`<div class="li"><div class="grow">${x.html}</div>${x.btn}</div>`).join('')||'<div class="small muted">All clear for this client.</div>'}</div></div>` }
    case 'plan': return `<div class="row-between" style="margin-bottom:16px;flex-wrap:wrap"><div class="small muted">Edit each month's theme and objectives, then assign action items under it. Clients see changes immediately.</div>${add('task','Assign task')}</div>
      ${c.months.map(m=>{const items=c.actions.filter(a=>a.month===m.n);const cm=currentMonth(c);return `<div class="card mblock ${m.key===cm.key?'now':''}">
        <div class="row-between" style="align-items:flex-start;flex-wrap:wrap"><div><div class="small" style="color:var(--brand);font-weight:700">Month ${m.n} · ${m.name} ${m.year}${m.key===cm.key?' · current':''}</div><div class="serif" style="font-size:22px">${esc(m.theme)}</div><div class="small muted" style="max-width:70ch">${esc(m.objective||'No objective yet')}</div></div>
          <div style="display:flex;gap:8px;align-items:center"><b class="small">${monthProgress(c,m.n)}%</b><button class="btn sm" data-adm="month" data-cid="${cid}" data-id="${m.n}">Edit month</button><button class="btn sm primary" data-adm="task" data-cid="${cid}" data-month="${m.n}">${ic('plus')}Task</button></div></div>
        ${items.length?`<div class="tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Priority</th><th style="width:160px">Status</th><th style="width:90px">Progress</th><th></th></tr></thead><tbody>
          ${items.map(a=>`<tr><td><b>${esc(a.title)}</b>${a.comments.length?`<div class="tiny muted">${a.comments.length} comment${a.comments.length>1?'s':''}</div>`:''}</td><td>${esc(a.owner)}</td><td style="${isOverdue(a)?'color:var(--bad);font-weight:700':''}">${fmtS(a.due)}</td><td>${prioBadge(a.priority)}</td>
          <td><select class="input sm-input" data-tstat="${cid}|${a.id}">${Object.keys(STATUS).map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="progress"><i style="width:${a.progress}%"></i></div></td><td style="text-align:right;white-space:nowrap">${rowBtns('task','actions',a.id,a.title)}</td></tr>`).join('')}
        </tbody></table></div>`:`<div class="small muted" style="margin-top:12px">No action items in this month yet.</div>`}</div>`}).join('')}`;
    case 'sessions': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">Schedule sessions, then publish a summary once they're held — the client is asked for feedback automatically.</div>${add('session','Schedule session')}</div>
      <div class="card" style="padding:8px 0"><div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Session</th><th>Mode</th><th>Status</th><th>Summary</th><th>Feedback</th><th></th></tr></thead><tbody>
      ${c.sessions.map(s=>{const f=c.feedback.find(x=>x.session===s.id);return `<tr><td style="white-space:nowrap">${fmt(s.date)}<div class="tiny muted">${s.time}</div></td><td><b>${esc(s.title)}</b></td><td>${s.mode}</td><td><span class="badge ${s.status==='Completed'?'b-ok':s.status==='Cancelled'?'b-mute':'b-brand'}">${s.status}</span></td>
        <td>${s.summary?`<button class="btn sm ghost" data-adm="summary" data-cid="${cid}" data-id="${s.id}">${ic('check')}Published</button>`:s.date<=TODAY&&s.status!=='Cancelled'?`<button class="btn sm primary" data-adm="summary" data-cid="${cid}" data-id="${s.id}">Write summary</button>`:'<span class="tiny muted">After the session</span>'}</td>
        <td>${f?stars(f.rating):'<span class="tiny muted">—</span>'}</td><td style="text-align:right;white-space:nowrap">${rowBtns('session','sessions',s.id,s.title)}</td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty"><b>No sessions yet</b>Schedule the kick-off session to get started.</div></td></tr>'}
      </tbody></table></div></div>`;
    case 'reports': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">${c.reports.length} reports published</div>${add('report','Upload report')}</div>
      <div class="card" style="padding:8px 0"><div class="tablewrap"><table class="t"><thead><tr><th>Report</th><th>Category</th><th>Date</th><th>File</th><th></th></tr></thead><tbody>
      ${c.reports.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td><b>${esc(r.name)}</b><div class="tiny muted">${esc((r.desc||'').slice(0,80))}</div></td><td>${esc(r.cat)}</td><td>${fmtS(r.date)}</td><td>${fileCell(r.file)}</td><td style="text-align:right;white-space:nowrap">${rowBtns('report','reports',r.id,r.name)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty"><b>No reports yet</b>Upload the business assessment report to begin.</div></td></tr>'}
      </tbody></table></div></div>`;
    case 'documents': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">${c.documents.length} files in the client's document library</div>${add('document','Upload documents')}</div>
      <div class="card" style="padding:8px 0"><div class="tablewrap"><table class="t"><thead><tr><th>File</th><th>Category</th><th>Uploaded</th><th>By</th><th></th></tr></thead><tbody>
      ${c.documents.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<tr><td>${fileHref(d)?`<button class="linkbtn" data-dl="${fileKey(d)}">${esc(d.name)}</button>`:`<b>${esc(d.name)}</b> <span class="tiny muted">(sample)</span>`}</td><td>${esc(d.cat)}</td><td>${fmtS(d.date)}</td><td>${esc(d.by)}</td><td style="text-align:right;white-space:nowrap">${rowBtns('document','documents',d.id,d.name)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty"><b>No documents yet</b>Upload the consulting agreement or action plan PDF.</div></td></tr>'}
      </tbody></table></div></div>`;
    case 'photos': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">${c.photos.length} photos in the client's gallery</div>${add('photo','Upload photos')}</div>
      ${c.photos.length?`<div class="pgrid">${c.photos.map(p=>`<div><div class="photo">${photoMedia(p)}<div class="cap"><b>${esc(p.title)}</b>${fmtS(p.date)} · ${esc(p.cat)}</div></div><div style="display:flex;gap:4px;margin-top:6px">${rowBtns('photo','photos',p.id,p.title)}</div></div>`).join('')}</div>`:'<div class="card empty"><b>No photos yet</b>Upload photos from workshops and sessions.</div>'}`;
    case 'updates': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">${c.updates.length} updates</div>${add('update','Publish update')}</div>
      <div class="card">${c.updates.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(u=>{const t=typeTone[u.type]||typeTone['General Update'];return `<div class="upd"><span class="ic ${t[0]}">${ic(t[1])}</span><div style="flex:1;min-width:0"><div class="row-between" style="align-items:flex-start"><b>${esc(u.title)}</b><span class="badge ${t[0]}">${u.type}</span></div><div class="tiny muted">${fmt(u.date)} · ${esc(u.cat)} · ${c.readUpdates.includes(u.id)?'Read by client':'Not read yet'}</div><div class="small" style="margin-top:4px">${esc(u.body)}</div><div style="margin-top:6px">${rowBtns('update','updates',u.id,u.title)}</div></div></div>`}).join('')||'<div class="empty"><b>No updates yet</b>Publish the first update for this client.</div>'}</div>`;
    case 'events': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">${c.events.length} events visible to this client</div>${add('event','Create event')}</div>
