      ${c.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td><b>${esc(e.title)}</b><div class="tiny muted">${esc(e.loc)}</div></td><td>${esc(e.type)}</td><td>${fmtS(e.date)}</td><td>${c.meta.registrations.includes(e.id)?'<span class="badge b-ok">Yes</span>':'<span class="tiny muted">No</span>'}</td><td style="text-align:right;white-space:nowrap">${rowBtns('event','events',e.id,e.title)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty"><b>No events yet</b>Invite this client to a workshop or business meet.</div></td></tr>'}
      </tbody></table></div></div>`;
    case 'notifications': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">Notifications are also sent automatically when you publish tasks, sessions, reports, updates and events.</div>${add('notif','Send notification')}</div>
      <div class="card">${c.notifications.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="li"><div class="grow"><div class="ttl">${esc(n.text)}</div><div class="sub">${fmt(n.date)} · ${n.cat} · ${n.read?'Read':'<b style="color:var(--brand)">Unread</b>'}</div></div><button class="btn sm ghost danger-t" data-del="notifications" data-cid="${cid}" data-id="${n.id}" data-label="this notification">Delete</button></div>`).join('')||'<div class="empty"><b>No notifications</b></div>'}</div>`;
    case 'scores': return `<div class="row-between" style="margin-bottom:16px"><div class="small muted">Scores drive the client's analytics page and transformation score.</div><button class="btn primary" data-adm="scores" data-cid="${cid}">Update scores</button></div>
      <div class="grid g2"><div class="card"><div class="card-head"><h3>Area scores</h3></div>${hbars(c.dept,{showPrev:true})}</div><div class="card"><div class="card-head"><h3>Overall score trend</h3></div>${c.scoreHistory.length?`<div class="tablewrap">${lineChart(c.scoreHistory,{min:0,max:100})}</div>`:'<div class="small muted">No scores logged yet.</div>'}</div></div>`;
    case 'feedback': return `<div class="card">${c.feedback.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(f=>{const s=c.sessions.find(x=>x.id===f.session);return `<div class="li"><div class="grow"><div class="row-between"><b>${esc(s?s.title:'Session')}</b>${stars(f.rating)}</div><div class="sub">${fmt(f.date)} · ${esc(f.relevance)}</div>${f.useful?`<div class="small"><b>Useful:</b> ${esc(f.useful)}</div>`:''}${f.improve?`<div class="small"><b>Improve:</b> ${esc(f.improve)}</div>`:''}${f.comments?`<div class="small muted">${esc(f.comments)}</div>`:''}</div></div>`}).join('')||'<div class="empty"><b>No feedback yet</b>Clients are asked for feedback when you publish a session summary.</div>'}</div>`;
    case 'profile': return `<div class="grid g-dash"><div class="card"><div style="display:flex;gap:16px;align-items:center;margin-bottom:18px">${clientLogo(c,64)}<div><div class="serif" style="font-size:26px">${esc(c.company)}</div><div class="muted small">${esc(c.industry||'')}${c.location?' · '+esc(c.location):''}</div></div></div>
      <dl class="kv"><dt>Client ID</dt><dd>${c.id}</dd><dt>Contact</dt><dd>${esc(c.contact)} ${c.contactTitle?'· '+esc(c.contactTitle):''}</dd><dt>Login email</dt><dd>${esc(c.email||'—')}</dd><dt>Portal password</dt><dd>${c.password?'••••••• <span class="tiny muted">(set)</span>':'<span style="color:var(--bad)">Not set — client cannot log in</span>'}</dd><dt>Phone</dt><dd>${esc(c.phone||'—')}</dd><dt>Size</dt><dd>${esc(c.size||'—')}</dd><dt>Period</dt><dd>${fmt(c.start)} – ${fmt(c.end)}</dd><dt>Consultant</dt><dd>${esc(c.consultant)}</dd><dt>Business areas</dt><dd>${c.areas.map(a=>`<span class="badge b-brand" style="margin:0 4px 4px 0">${esc(a)}</span>`).join('')}</dd></dl>
      <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="btn primary" data-adm="client" data-cid="${cid}">Edit profile & branding</button><button class="btn" data-preview="${cid}">${ic('eye')}Preview portal</button></div></div>

  }
  return '';
}

// ---------- TASK BOARD ----------
function adminTasksPage(){
  const cl=allClients(); const f=state.tbClient||'all', ov=state.tbOverdue;
  let rows=cl.filter(c=>f==='all'||c.id===f).flatMap(c=>c.actions.map(a=>({c,a})));
  if(ov) rows=rows.filter(x=>isOverdue(x.a)||x.a.status==='Delayed');
  const cols=Object.keys(STATUS);
  return `<div class="pagehead"><div><h1>Task board</h1><p>Every action item across your clients. Change a status here and the client's plan updates instantly.</p></div><button class="btn primary" data-adm="task" ${f!=='all'?`data-cid="${f}"`:''}>${ic('plus')}Assign task</button></div>
  <div class="row-between" style="margin-bottom:16px;flex-wrap:wrap"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <select class="input" style="width:auto" data-tbclient>${[['all','All clients'],...clientOpts()].map(o=>`<option value="${o[0]}" ${o[0]===f?'selected':''}>${esc(o[1])}</option>`).join('')}</select>
    <label class="check"><input type="checkbox" data-tboverdue ${ov?'checked':''}>Overdue or delayed only</label></div><span class="small muted">${rows.length} tasks</span></div>
  <div class="tablewrap"><div class="kanban">${cols.map(s=>{const it=rows.filter(x=>x.a.status===s).sort((a,b)=>a.a.due.localeCompare(b.a.due));return `<div class="kcol"><div class="khead">${statusBadge(s)}<span class="tiny muted">${it.length}</span></div>
    ${it.map(({c,a})=>`<div class="kcard"><div class="clickable" data-adm="task" data-cid="${c.id}" data-id="${a.id}"><div class="ttl small" style="font-weight:700">${esc(a.title)}</div>${f==='all'?`<div style="margin:6px 0">${clientChip(c)}</div>`:''}<div class="tiny muted">${esc(a.owner)} · <span style="${isOverdue(a)?'color:var(--bad);font-weight:700':''}">due ${fmtS(a.due)}</span> · ${a.priority}</div></div>
      <div class="progress" style="margin:8px 0"><i style="width:${a.progress}%"></i></div><select class="input sm-input" data-tstat="${c.id}|${a.id}" aria-label="Status">${cols.map(x=>`<option ${x===a.status?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<div class="tiny muted" style="padding:8px">None</div>'}</div>`}).join('')}</div></div>`;
}

// ---------- SESSION SCHEDULE ----------
function adminSessionsPage(){
  const cl=allClients(); const all=cl.flatMap(c=>c.sessions.map(s=>({c,s})));
  const up=all.filter(x=>x.s.status==='Upcoming'&&x.s.date>=TODAY).sort((a,b)=>a.s.date.localeCompare(b.s.date));
  const need=all.filter(x=>x.s.date<TODAY&&x.s.status!=='Cancelled'&&!x.s.summary).sort((a,b)=>b.s.date.localeCompare(a.s.date));
  const done=all.filter(x=>x.s.summary).sort((a,b)=>b.s.date.localeCompare(a.s.date)).slice(0,10);
  const row=({c,s},btn)=>`<div class="li"><div class="datebox"><b>${D(s.date).getDate()}</b><span>${MON[D(s.date).getMonth()]}</span></div><div class="grow"><div class="ttl">${esc(s.title)}</div><div class="sub">${esc(c.company)} · ${s.time||''} · ${s.mode}</div></div>${btn}</div>`;

function openModal(content, cls=''){
  const r=document.getElementById('modal-root');
  if(!r) return;
  r.innerHTML=`<div class="overlay" id="curModal"><div class="modal ${cls}" role="dialog" aria-modal="true">${content}</div></div>`;
  const o=r.querySelector('.overlay');
  o.onclick=(e)=>{ if(e.target===o) closeModal() };
  r.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal());
}

function closeModal(){
  const r=document.getElementById('modal-root');
  if(r) r.innerHTML='';
}

function toast(msg){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.opacity='0';
    el.style.transition='opacity .3s ease';
    setTimeout(()=>el.remove(),300);
  },3200);
}

function downloadICS(session){
  const sDate=session.date.replace(/-/g,'');
  const [startH='10',startM='00']=((session.start||session.time||'10:00').split(' –')[0]).split(':');
  const [endH='11',endM='30']=((session.end||'11:30')).split(':');
  const dtStart=`${sDate}T${startH.padStart(2,'0')}${startM.padStart(2,'0')}00`;
  const dtEnd=`${sDate}T${endH.padStart(2,'0')}${endM.padStart(2,'0')}00`;
  const icsData=[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//WeGrow B School//Client Portal//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `SUMMARY:${session.title}`,
    `DESCRIPTION:WeGrow consulting session with ${session.consultant || 'WeGrow consultant'}. ${session.link?('\\nLink: '+session.link):''}`,
    `LOCATION:${session.location || 'Online'}`,
    `DTSTART:${dtStart}`,
    `DTEND:${dtEnd}`,
    'STATUS:CONFIRMED',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([icsData],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${session.title.replace(/\W+/g,'_')}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Calendar event exported');
}

function downloadOrOpenFile(f){
  if(!f) return toast('File not available');
  const href=fileHref(f);
  if(href){
    window.open(href,'_blank');
    return;
  }
  const dummyContent=`WeGrow B School Transformation Report\nFile: ${f.name}\nExported: ${new Date().toLocaleDateString()}\nStatus: Verified Consulting Asset\nCompany Confidential`;
  const blob=new Blob([dummyContent],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=f.name||'document.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`Downloaded ${f.name}`);
}

function bindLogin(){
  const f=document.getElementById('loginForm');
  if(!f) return;
  f.onsubmit=(e)=>{
    e.preventDefault();
    const em=document.getElementById('em').value;
    const pw=document.getElementById('pw').value;
    const rm=document.getElementById('rm').checked;
    const res=login(em,pw,rm);
    if(res===true){
      location.hash = state.user.role==='admin' ? '#/admin' : '#/dashboard';
      render();
    } else if(res==='noadmin'){
      renderWithErr('Admin capabilities are restricted in this view.');
    } else {
      renderWithErr('Invalid email/client ID or password. Check demo credentials below.');
    }
  };
  document.querySelectorAll('[data-demo]').forEach(b=>{
    b.onclick=()=>{
      const [em,pw]=b.dataset.demo.split('|');
      document.getElementById('em').value=em;
      document.getElementById('pw').value=pw;
      f.dispatchEvent(new Event('submit'));
    };
  });
  const forgotBtn=document.querySelector('[data-act="forgot"]');
  if(forgotBtn){
    forgotBtn.onclick=(e)=>{
      e.preventDefault();
      openModal(`<div class="mh"><h2>Password assistance</h2><button class="iconbtn" data-close>${ic('close')}</button></div>
      <div class="mb"><p class="small">For client portal access recovery, please contact your designated WeGrow Lead Consultant or email <b>support@wegrow.in</b>.</p></div>
      <div class="mf"><button class="btn primary" data-close>Understood</button></div>`);
    };
  }
}

function renderWithErr(msg){
  document.getElementById('root').innerHTML=loginPage(msg);
  bindLogin();
}

function bindEvents(c){
  // Global Shell actions
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=(e)=>{
      e.preventDefault();
      const act=b.dataset.act;
      if(act==='open-sb') state.sidebarOpen=true;
      if(act==='close-sb') state.sidebarOpen=false;
      if(act==='collapse') { state.collapsed=!state.collapsed; store.set('collapsed',state.collapsed); }
      if(act==='menu') state.menu=!state.menu;
      if(act==='logout') logout();
      if(act==='exit-preview') { state.previewAs=null; location.hash='#/admin'; }
      if(act==='theme') {
        const cur=document.documentElement.getAttribute('data-theme')||'light';
        const next=cur==='dark'?'light':'dark';
        document.documentElement.setAttribute('data-theme',next);
        store.set('theme',next);
      }
      if(act==='readall' && c){
        c.notifications.forEach(n=>n.read=true);
        Data.patch(c.id,'notifications',c.notifications);
        toast('All notifications marked as read');
      }
      if(act==='pw'){
        openModal(`<div class="mh"><h2>Change portal password</h2><button class="iconbtn" data-close>${ic('close')}</button></div>
        <form class="mb" id="pwForm">
          <div class="field"><label>Current password</label><input class="input" type="password" required></div>
          <div class="field"><label>New password</label><input class="input" type="password" required></div>
          <button class="btn primary block" type="submit">Update password</button>
        </form>`);
        document.getElementById('pwForm').onsubmit=(ev)=>{
          ev.preventDefault();
          closeModal();
          toast('Password successfully updated');
        };
      }
      render();
    };
  });

  // Client view triggers
  document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{
    state.apMonth=+b.dataset.month;
    location.hash='#/action-plan';
    render();
  });
  document.querySelectorAll('[data-apmonth]').forEach(b=>b.onclick=()=>{
    state.apMonth=null;
    render();
  });
  document.querySelectorAll('[data-apview]').forEach(b=>b.onclick=()=>{
    state.apView=b.dataset.apview;
    render();
  });
  document.querySelectorAll('[data-sesstab]').forEach(b=>b.onclick=()=>{
    state.sessTab=b.dataset.sesstab;
    render();
  });
  document.querySelectorAll('[data-evtab]').forEach(b=>b.onclick=()=>{
    state.eventTab=b.dataset.evtab;
    render();
  });
  document.querySelectorAll('[data-calview]').forEach(b=>b.onclick=()=>{
    state.calView=b.dataset.calview;
    render();
  });
  document.querySelectorAll('[data-calnav]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.calnav;
    if(state.calView==='month'){
      const d=D(state.calCursor);
      if(n===0) state.calCursor=TODAY.slice(0,7)+'-01';
      else { d.setMonth(d.getMonth()+n); state.calCursor=iso(d); }
    } else if(state.calView==='week'){
      if(n===0) state.weekCursor=addDays(TODAY,-D(TODAY).getDay());
      else state.weekCursor=addDays(state.weekCursor,n*7);
    }
    render();
  });

  // Filters
  document.querySelectorAll('[data-rfilter]').forEach(b=>b.onclick=()=>{ state.reportFilter=b.dataset.rfilter; render(); });
  document.querySelectorAll('[data-ufilter]').forEach(b=>b.onclick=()=>{ state.updFilter=b.dataset.ufilter; render(); });
  document.querySelectorAll('[data-dfilter]').forEach(b=>b.onclick=()=>{ state.docFilter=b.dataset.dfilter; render(); });
  document.querySelectorAll('[data-pfilter]').forEach(b=>b.onclick=()=>{ state.photoFilter=b.dataset.pfilter; render(); });
  document.querySelectorAll('[data-nfilter]').forEach(b=>b.onclick=()=>{ state.notifFilter=b.dataset.nfilter; render(); });

  // Detail Modals
  if(c){
    document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>actionModal(c,el.dataset.action));
    document.querySelectorAll('[data-session]').forEach(el=>el.onclick=()=>sessionModal(c,el.dataset.session));
    document.querySelectorAll('[data-report]').forEach(el=>el.onclick=()=>reportModal(c,el.dataset.report));
    document.querySelectorAll('[data-update]').forEach(el=>el.onclick=()=>updateModal(c,el.dataset.update));
    document.querySelectorAll('[data-photo]').forEach(el=>el.onclick=()=>photoModal(c,el.dataset.photo));
    document.querySelectorAll('[data-event]').forEach(el=>el.onclick=()=>eventModal(c,el.dataset.event));
    document.querySelectorAll('[data-fb]').forEach(el=>el.onclick=()=>feedbackModal(c,el.dataset.fb));
    document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{
      const s=c.sessions.find(x=>x.id===b.dataset.join);
      if(s&&s.link) window.open(s.link,'_blank');
      else toast('Meeting link will be active 10 minutes prior to session.');
    });
    document.querySelectorAll('[data-ics]').forEach(b=>b.onclick=()=>{
      const s=c.sessions.find(x=>x.id===b.dataset.ics);
      if(s) downloadICS(s);
    });
    document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{
      c.meta.registrations.push(b.dataset.reg);
      saveMeta(c);
      toast('Registration confirmed for event');
      closeModal();
      render();
    });
    document.querySelectorAll('[data-unreg]').forEach(b=>b.onclick=()=>{
      c.meta.registrations=c.meta.registrations.filter(x=>x!==b.dataset.unreg);
      saveMeta(c);
      toast('Event registration cancelled');
      closeModal();
      render();
    });
    document.querySelectorAll('[data-cal]').forEach(el=>el.onclick=()=>{
      const [type,ref]=el.dataset.cal.split('|');
      openCalItem(c,type,ref);
    });
  }

  // Admin and management triggers
  document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{
    state.previewAs=b.dataset.preview;
    location.hash='#/dashboard';
    render();
  });
  document.querySelectorAll('[data-adm]').forEach(b=>b.onclick=()=>{
    const adm=b.dataset.adm;
    const cid=b.dataset.cid||null;
    const id=b.dataset.id||null;
    const m=b.dataset.month||null;
    if(adm==='client') clientForm(cid);
    if(adm==='task') taskForm(cid,id,m);
    if(adm==='session') sessionForm(cid,id);
    if(adm==='summary') summaryForm(cid,id);
    if(adm==='report') reportForm(cid,id);
    if(adm==='document') documentForm(cid,id);
    if(adm==='photo') photoForm(cid,id);
    if(adm==='update') updateForm(cid,id);
    if(adm==='event') eventForm(cid,id);
    if(adm==='notif') notifForm(cid);
    if(adm==='scores') scoresForm(cid);
    if(adm==='upload') uploadPicker(cid);
    if(adm==='archive'){
      confirmModal(`Archive ${cname(cid)}?`,'Archive client',async()=>{
        const cl=DB.clients[cid];
        if(cl){ cl.status='Archived'; await Data.saveProfile(cid,cl); }
        location.hash='#/admin-clients';
        render();
      });
    }
  });

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    delItem(b.dataset.cid, b.dataset.del, b.dataset.id, b.dataset.label||'item');
  });

  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    const f=FILES.get(b.dataset.dl);
    downloadOrOpenFile(f);
  });

  document.querySelectorAll('[data-view-doc]').forEach(b=>b.onclick=()=>{
    const f=FILES.get(b.dataset.viewDoc);
    if(f) downloadOrOpenFile(f);
  });

  document.querySelectorAll('[data-tstat]').forEach(sel=>sel.onchange=()=>{
    const [cid,id]=sel.dataset.tstat.split('|');
    setTaskStatus(cid,id,sel.value);
  });

  // Task Board controls
  const tbClientSel=document.querySelector('[data-tbclient]');
  if(tbClientSel){
    tbClientSel.onchange=()=>{
      state.tbClient=tbClientSel.value;
      render();
    };
  }
  const tbOverdueChk=document.querySelector('[data-tboverdue]');
  if(tbOverdueChk){
    tbOverdueChk.onchange=()=>{
      state.tbOverdue=tbOverdueChk.checked;
      render();
    };
  }

  // Broadcast form handler
  const bcForm=document.getElementById('broadcastForm');
  if(bcForm){
    bcForm.onsubmit=async(e)=>{
      e.preventDefault();
      const cids=[...bcForm.querySelectorAll('input[name="cids"]:checked')].map(i=>i.value);
      if(!cids.length) return toast('Select at least one client to send the broadcast to.');
      const title=document.getElementById('bcTitle').value.trim();
      const type=document.getElementById('bcType').value;
      const cat=document.getElementById('bcCat').value;
      const body=document.getElementById('bcBody').value.trim();
      const sendNotif=document.getElementById('bcNotif').checked;
      const btn=document.getElementById('bcSubmit');
      btn.disabled=true;
      btn.textContent='Publishing broadcast…';
      for(const cid of cids){
        const cl=DB.clients[cid];
        if(cl){
          const upd={id:uid('U'),title,type,cat,body,date:TODAY};
          await Data.patch(cid,'updates',[upd,...cl.updates]);
          if(sendNotif){
            await notify(cid,type==='Action Required'?'Important':'Reports',`Broadcast: ${title}`,'#/updates');
          }
        }
      }
      toast(`Broadcast published to ${cids.length} client${cids.length>1?'s':''}`);
      btn.disabled=false;
      btn.textContent='Publish broadcast';
      bcForm.reset();
      render();
    };
  }
}

// =========================================================
// MAIN ENTRY POINT & BOOTSTRAP
// =========================================================
function render(soft=false){
  restore();
  const r=route();
  const root=document.getElementById('root');
  if(!root) return;

  if(!state.user){
    if(r.page!=='login') location.hash='#/login';
    root.innerHTML=loginPage();
    bindLogin();
    return;
  }

  if(r.page==='login'){
    location.hash = state.user.role==='admin' && !state.previewAs ? '#/admin' : '#/dashboard';
    return;
  }

  // Admin console routing
  if(state.user.role==='admin' && !state.previewAs){
    let content='';
    switch(r.page){
      case 'admin': content=adminOverviewPage(); break;
      case 'admin-clients': content=adminClientsPage(); break;
      case 'admin-client': content=adminClientPage(r.arg); break;
      case 'admin-tasks': content=adminTasksPage(); break;
      case 'admin-sessions': content=adminSessionsPage(); break;
      case 'admin-feedback': content=adminFeedbackPage(); break;
      case 'admin-broadcast': content=adminBroadcastPage(); break;
      default: content=adminOverviewPage(); break;
    }
    root.innerHTML=shell(null, content, r.page);
    bindEvents(null);
    return;
  }

  // Client view or Consultant preview routing
  const c=scope();
  if(!c){
    root.innerHTML=`<div class="card empty" style="margin:40px auto;max-width:480px">
      <b>Client portal not found</b>
      <p class="small muted">The client record could not be loaded or was archived.</p>
      <a class="btn primary sm" href="#/admin">Return to consultant console</a>
    </div>`;
    return;
  }

  let content='';
  switch(r.page){
    case 'dashboard': content=dashboardPage(c); break;
    case 'action-plan': content=actionPlanPage(c); break;
    case 'sessions': content=sessionsPage(c); break;
    case 'reports': content=reportsPage(c); break;
    case 'updates': content=updatesPage(c); break;
    case 'analytics': content=analyticsPage(c); break;
    case 'calendar': content=calendarPage(c); break;
    case 'events': content=eventsPage(c); break;
    case 'photos': content=photosPage(c); break;
    case 'feedback': content=feedbackPage(c); break;
    case 'documents': content=documentsPage(c); break;
    case 'notifications': content=notificationsPage(c); break;
    case 'profile': content=profilePage(c); break;
    case 'settings': content=settingsPage(c); break;
    default: content=dashboardPage(c); break;
  }
  root.innerHTML=shell(c, content, r.page);
  bindEvents(c);
}

// Initialise theme
const savedTheme=store.get('theme',null);
if(savedTheme) document.documentElement.setAttribute('data-theme',savedTheme);

// Routing listener
window.addEventListener('hashchange',()=>render());

// Launch App
window.addEventListener('DOMContentLoaded',()=>{
  Data.init().then(()=>render());
});
</script>
</body>
</html>
